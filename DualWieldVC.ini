[DualWield]
Enabled=1
Pistol=1
Tec9=1
Mac10=1
DoubleShot=1

; VC stock renders the native weapon from m_apFrames[6] / HAnim 24.
; The added weapon is attached to m_apFrames[5] / HAnim 34.
QuaternionPoseMirror=1
AttachCloneToActualHand=1

; v14 grip fix:
; The second gun uses the SAME world-space weapon orientation as VC's native gun.
; Only its position comes from the opposite hand. Do not reflect the weapon basis:
; the model is the same (not mirrored) and both barrels should face the same direction.
CopyNativeGripBasis=1

; Optional weapon-local trim. Leave at zero first.
GripTrimOffsetX=0.000000
GripTrimOffsetY=0.000000
GripTrimOffsetZ=0.000000
GripTrimRotationX=0.000000
GripTrimRotationY=0.000000
GripTrimRotationZ=0.000000

ArmIKRequiresFire=0
ArmIKWhileMoving=1
ArmIKMoveSpeedLimit=0.20
MirrorAimBlend=1.00
MirrorHoldBlend=0.90
MirrorReloadBlend=0.90
AimGraceFrames=3
AimBlendFrames=2

ChainExistingCallHooks=1

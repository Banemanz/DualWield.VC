[DualWield]
Enabled=1
Pistol=1
Uzi=1
Tec9=1
DoubleShot=1

; v12: VC 1.0 stock CPed::Render hardwires the native weapon to
; m_apFrames[6] / HAnim 24 (SRhand). The second weapon is therefore fixed to
; m_apFrames[5] / HAnim 34 (SLhand). There is intentionally no SecondHandRight key.

; Rotate opposite-arm HAnim interpolation quaternions and rebake with VC's own
; CEntity::UpdateRpHAnim. This mirrors the already-correct native gun arm pose.
QuaternionPoseMirror=1
AttachCloneToActualHand=1

; Keep the mirrored arm participating in idle/movement/reload instead of gating it off.
ArmIKRequiresFire=0
ArmIKWhileMoving=1
ArmIKMoveSpeedLimit=0.20

; Because v12 mirrors VC's native arm rather than inventing an aim target, strong
; blend values are appropriate and preserve locomotion/reload state from that arm.
MirrorAimBlend=1.00
MirrorHoldBlend=0.90
MirrorReloadBlend=0.90
AimGraceFrames=3
AimBlendFrames=2

; SA's real twin-pistol render path uses this exact left-hand correction:
; rotate X 180 degrees, then translate +0.04, -0.05, 0 in weapon/hand space.
LeftGripOffsetX=0.040000
LeftGripOffsetY=-0.050000
LeftGripOffsetZ=0.000000
LeftGripRotationX=180.000000
LeftGripRotationY=0.000000
LeftGripRotationZ=0.000000

ChainExistingCallHooks=1
